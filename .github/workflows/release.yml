name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - name: build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version"
          mkdir -p release
          binary=ticket
          if [ "$GOOS" = windows ]; then binary=ticket.exe; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/toolsupply/ticket/internal/cli.Version=$version -X github.com/toolsupply/ticket/internal/cli.Commit=$GITHUB_SHA" \
            -o "$binary" ./cmd/ticket
          archive="ticket-$GOOS-$GOARCH"
          if [ "${{ matrix.archive }}" = zip ]; then
            zip -q "release/$archive.zip" "$binary"
          else
            tar -czf "release/$archive.tar.gz" "$binary"
          fi
      - name: attest release archive
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  skill:
    name: package ticket-tasks skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: package skill
        shell: bash
        run: |
          set -eu
          mkdir -p release/stage/ticket-tasks
          cp -R skills/ticket-tasks/. release/stage/ticket-tasks/
          (cd release/stage && zip -q -r ../ticket-tasks.zip ticket-tasks)
          rm -rf release/stage
      - name: attest skill archive
        uses: actions/attest@v4
        with:
          subject-path: release/ticket-tasks.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-skill
          path: release/ticket-tasks.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, skill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: checksums
        working-directory: release
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
